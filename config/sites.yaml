# One entry per river system. bbox = (west, south, east, north) in EPSG:4326.
# The bbox is ONLY the DEM download/analysis window. All reported statistics are computed
# on the delineated basin (reviewer comment 2); window stats are also written for comparison.
#
# status: "from_report"  -> bounds/outlet taken from the uploaded deep-dive PDFs
#         "PROVISIONAL"  -> approximate; confirm against your paper before using any number.
# `expected` is a regression/sanity check on the delineated basin area (km2, +/- tol fraction).

defaults:
  dem: glo90                    # glo90 | path to local DEM (set `dem_path` per site)
  sea_level_m: 0.0
  stream_threshold_km2: 10
  threshold_sweep_km2: [5, 10, 25, 50]
  snap_radius_m: 3000
  n_source_groups: 4            # main-stem remainder + (n-1) largest tributaries; residual reported separately
  basin_name_suffix: ""

sites:
  cdo:
    name: Cagayan de Oro River (Macajalar Bay)
    status: from_report
    bbox: [124.55, 7.99, 125.08, 8.56]          # window in the CDO deep-dive report
    outlet: [124.6521, 8.4971]                  # lon, lat of screened CDO mouth in the report
    snap_radius_m: 2500
    expected: {basin_area_km2: 1139.08, tol: 0.10}   # in-window outlet-group area in the report
    # Source-group anchors. T and B are located ON NAMED HYDROGRAPHY (OSM lines fetched by
    # scripts/fetch_osm_rivers.py): the D8 stream cells lying within `buffer_m` of the named line are followed
    # down to the main stem. `chainage_km` (JICA, paper Table 15) is kept ONLY as an audit value - it no longer
    # selects the stream (nearest-to-chainage picked the wrong tributaries for both rivers).
    # If the hydrography file is missing, the run falls back to chainage matching and says so loudly.
    # The graph nodes U/T/B/L stay conceptual; these polygons are GIS screening support for the reviewer.
    source_group_anchors:
      upstream_group: U_upper_cdo
      upstream_graph_node: U
      residual_group: L_lower_laterals
      residual_graph_node: L
      hydrography: data/reference/cdo_named_rivers.geojson
      name_field: name
      buffer_m: 150
      tolerance_km: 3.0                 # fallback (chainage) mode only
      anchors:
        - {name: T_tumalaong, graph_node: T, river_match: "Tumalaong", chainage_km: 22.3}   # JICA CH 22.3
        - {name: B_bubunawan, graph_node: B, river_match: "Bubunawan", chainage_km: 18.5}   # JICA CH 18.5
    # Alternative: named points by coordinate (overrides nothing; remove anchors above to use):
    # source_groups:
    #   - {name: upper_cdo,  lon: ..., lat: ...}
    #   - {name: tumalaong,  lon: ..., lat: ...}   # JICA chainage ~22.3 km
    #   - {name: bubunawan,  lon: ..., lat: ...}   # JICA chainage ~18.5 km
    # reference:
    #   basin:   data/reference/cdo_basin.gpkg     # e.g. agency / Phil-LiDAR basin polygon
    #   streams: data/reference/cdo_rivers.gpkg
    #   tolerance_m: 200
    # alt_dem_path: data/reference/cdo_dtm.tif     # DTM / LiDAR / FABDEM for DSM-vs-DTM sensitivity

  tondano:
    name: Tondano-Tikala / Manado
    status: PROVISIONAL
    bbox: [124.75, 1.10, 125.05, 1.52]          # JICA study-area frame (1°07'-1°31'N, 124°45'-125°02'E)
    outlet: [124.8365, 1.4930]
    snap_radius_m: 2500
    expected: {basin_area_km2: 544.13, tol: 0.15}   # Rapar et al. 2014; JICA 547.55 km2
    notes: Lake Tondano is a flat DSM surface; D8 routing across it is artificial (see README).

  kuranji:
    name: Batang Kuranji / Padang
    status: PROVISIONAL
    bbox: [100.30, -0.98, 100.60, -0.75]        # published 2021 watershed rectangle, padded
    outlet: [100.358, -0.915]
    snap_radius_m: 2500                         # keep small: Batang Arau mouth is ~3 km away
    expected: {basin_area_km2: 213.7, tol: 0.10}    # 202.70 (2020) - 224.70 (2021) km2

  hue:
    name: Huong River / Hue
    status: PROVISIONAL
    bbox: [106.95, 16.00, 108.00, 16.75]
    outlet: [107.635, 16.565]
    snap_radius_m: 5000
    expected: {basin_area_km2: 2830, tol: 0.35}     # core flood-model domain; JICA planning ~3,300

  kota_belud:
    name: Kadamaian River / Kota Belud
    status: PROVISIONAL
    bbox: [116.20, 6.05, 116.60, 6.45]
    outlet: [116.335, 6.375]
    snap_radius_m: 5000
    expected: {basin_area_km2: 373.7, tol: 0.25}    # 359.36 (HEC-RAS study) - 388 km2 (DID)

  hat_yai:
    name: U-Tapao / Khlong Wat / Hat Yai
    status: PROVISIONAL
    bbox: [100.10, 6.45, 100.90, 7.30]
    outlet: [100.545, 7.145]
    snap_radius_m: 6000
    expected: {basin_area_km2: 2305, tol: 0.30}
