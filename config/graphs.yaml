# The six executed directed graphs (paper sections 3.3, 3.4.8, 3.5.8, 3.6.9, 3.7.8, 3.8.9, 3.9.9).
#
# READ THIS FIRST (GIS reviewer comment 4):
#   * Nodes are NAMED REGIONAL COMPONENTS or DECLARED AGGREGATES. A source node is a
#     computational injection point, NOT a delineated catchment polygon.
#   * Edges are permitted forward transfers. "Map proximity alone is insufficient to add an edge."
#   * Logical distances are counts of delay-bearing links, not km and not travel times.
#   * `delay: false` marks a zero-delay control connector (no ordinary memory, no tick shift).
#   * Everything here was transcribed from the manuscript's Table 3/4/4a/4b and Figures
#     5, 16, 29, 43, 58, 72. Edge lists are CHECKED against Table 4 (nodes, edges, sources,
#     logical distances) by `python scripts/run_graphs.py` and by the tests.
#   * `evidence:` blocks hold only what the manuscript states. `null` = not recorded in the
#     manuscript and must be filled by the author (map view URL/coordinates, capture date,
#     digitising confidence) - nothing has been invented.
#
# roles: source | storage | junction | zone | probe | receiver | boundary
# aggregate: true -> a declared aggregate / unresolved area (dashed in the figures)
# provisional: true -> placement is provisional in the paper

